[package]
name = "virtualcam"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform Rust virtual camera with Media Foundation, OBS and V4L2 backends"
license = "AGPL-3.0"
repository = "https://github.com/Jagirium/virtualcam"
keywords = ["camera", "virtual-camera", "obs", "video", "streaming"]
categories = ["multimedia::video", "api-bindings"]
homepage = "https://github.com/Jagirium/virtualcam"
readme = "README.md"

[lib]
name = "virtualcam"
path = "src/lib.rs"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "gradient"
path = "examples/gradient.rs"

[[bin]]
name = "vcam-pump"
path = "src/bin/pump.rs"
required-features = ["media-foundation"]

[[bin]]
name = "vcam-verify"
path = "src/bin/verify.rs"
required-features = ["media-foundation"]

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
cudarc = { version = "0.19.4", features = ["cuda-12080"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_Devices_Properties",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
]}
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
env_logger = "0.11"
ctrlc = "3.4"

[features]
default = ["media-foundation", "obs", "v4l2"]
media-foundation = []
obs = []
v4l2 = []
gpu = ["dep:cudarc"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
