[package]
name = "virtualcam"
version = "0.1.1"
edition = "2024"
description = "A simple Rust module for equally simple interaction with a virtual camera"
license = "Apache-2.0"
repository = "https://github.com/NeuroDonu/virtualcam"
keywords = ["camera", "virtual-camera", "obs", "video", "streaming"]
categories = ["multimedia::video", "api-bindings"]

[lib]
name = "virtualcam"
path = "src/lib.rs"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "gradient"
path = "examples/gradient.rs"

[dependencies]
thiserror = "1.0"
log = "0.4"
lazy_static = "1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
]}
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = ["ioctl", "fs"] }

[dev-dependencies]
env_logger = "0.11"
ctrlc = "3.4"

[features]
default = ["obs", "unity-capture", "v4l2"]
obs = []
unity-capture = []
v4l2 = []
cuda = ["cudarc"]

[dependencies.cudarc]
version = "0.18"
optional = true
features = ["driver"]
